name: AngelGRIB Windows build experiment

on:
  push:
    branches:
      - template-migration
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows MSVC build experiment
    runs-on: windows-2022

    env:
      WXWIN: C:\wxWidgets-3.2.1
      WX_VER: 32
      wxWidgets_ROOT_DIR: C:\wxWidgets-3.2.1
      wxWidgets_LIB_DIR: C:\wxWidgets-3.2.1\lib\vc_dll
      OCPN_TARGET: MSVC
      GETTEXT_BIN: C:\msys64\usr\bin

    steps:
      - name: Checkout without submodules first
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Vendor OpenCPN libs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item "opencpn-libs" -Recurse -Force -ErrorAction SilentlyContinue

          $urls = @(
            "https://github.com/OpenCPN/opencpn-libs.git",
            "https://github.com/jongough/opencpn-libs.git",
            "https://github.com/Rasbats/opencpn-libs.git"
          )

          $ok = $false

          foreach ($url in $urls) {
            Write-Host "Trying opencpn-libs source: $url"

            Remove-Item "opencpn-libs" -Recurse -Force -ErrorAction SilentlyContinue

            git clone --depth 1 $url opencpn-libs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Clone failed: $url"
              continue
            }

            $required = @(
              "opencpn-libs/WindowsHeaders",
              "opencpn-libs/api-18",
              "opencpn-libs/tinyxml",
              "opencpn-libs/odapi",
              "opencpn-libs/jsonlib",
              "opencpn-libs/wxJSON",
              "opencpn-libs/plugin_dc"
            )

            $missing = @()
            foreach ($path in $required) {
              if (-not (Test-Path $path)) {
                $missing += $path
              }
            }

            if ($missing.Count -eq 0) {
              Write-Host "OpenCPN libs OK from: $url"
              $ok = $true
              break
            }

            Write-Host "Source did not contain all required paths:"
            $missing | ForEach-Object { Write-Host "  missing: $_" }
          }

          if (-not $ok) {
            Get-ChildItem "opencpn-libs" -Force -ErrorAction SilentlyContinue
            throw "Could not vendor required OpenCPN libs."
          }

      - name: Show repository state
        shell: pwsh
        run: |
          git status
          Get-ChildItem
          Get-ChildItem opencpn-libs

      - name: Install helper tools
        shell: pwsh
        run: |
          choco install wget 7zip nsis -y --no-progress

      - name: Install Gettext using MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: gettext

      - name: Verify Gettext tools
        shell: pwsh
        run: |
          $msgmerge = "C:\msys64\usr\bin\msgmerge.exe"
          $msgfmt = "C:\msys64\usr\bin\msgfmt.exe"

          if (-not (Test-Path $msgmerge)) {
            throw "msgmerge.exe not found at $msgmerge"
          }

          if (-not (Test-Path $msgfmt)) {
            throw "msgfmt.exe not found at $msgfmt"
          }

          Write-Host "msgmerge: $msgmerge"
          Write-Host "msgfmt:   $msgfmt"

          "$env:GETTEXT_BIN" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download wxWidgets 3.2.1 MSVC dev files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:WXWIN | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.1/wxMSW-3.2.1_vc14x_Dev.7z" `
            -OutFile "wxMSW-3.2.1_vc14x_Dev.7z"

          Invoke-WebRequest `
            -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.1/wxWidgets-3.2.1-headers.7z" `
            -OutFile "wxWidgets-3.2.1-headers.7z"

          7z x "wxMSW-3.2.1_vc14x_Dev.7z" "-o$env:WXWIN" -y
          7z x "wxWidgets-3.2.1-headers.7z" "-o$env:WXWIN" -y

          Get-ChildItem $env:WXWIN

      - name: Download OpenCPN Windows build support
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://sourceforge.net/projects/opencpnplugins/files/opencpn.lib" `
            -OutFile "opencpn.lib"

          Invoke-WebRequest `
            -Uri "https://download.opencpn.org/s/oibxM3kzfzKcSc3/download" `
            -OutFile "OpenCPN_buildwin-4.99a.7z"

          7z x -y "OpenCPN_buildwin-4.99a.7z" "-obuildwin"

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          set PATH=%PATH%;%WXWIN%;%wxWidgets_LIB_DIR%;C:\msys64\usr\bin
          cmake -S . -B build -A Win32 ^
            -DGETTEXT_MSGMERGE_EXECUTABLE=C:/msys64/usr/bin/msgmerge.exe ^
            -DGETTEXT_MSGFMT_EXECUTABLE=C:/msys64/usr/bin/msgfmt.exe

      - name: Build package
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          set PATH=%PATH%;%WXWIN%;%wxWidgets_LIB_DIR%;C:\msys64\usr\bin
          cmake --build build --target package --config Release --verbose

      - name: Inject metadata.xml into plugin tarball using Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tarballs = Get-ChildItem -Path build -Recurse -Filter "*.tar.gz"
          $xmlFiles = Get-ChildItem -Path build -Recurse -Filter "*.xml" |
            Where-Object { $_.Name -like "angelgrib_pi-*.xml" -or $_.Name -like "*angelgrib*.xml" }

          if ($tarballs.Count -eq 0) {
            throw "No .tar.gz plugin tarball found under build."
          }

          if ($xmlFiles.Count -eq 0) {
            throw "No AngelGRIB metadata XML found under build."
          }

          $xml = $xmlFiles | Select-Object -First 1
          Write-Host "Using metadata XML: $($xml.FullName)"

          $script = Join-Path $env:RUNNER_TEMP "inject_metadata_into_tarball.py"

          @'
import os
import sys
import tarfile
import shutil
import tempfile

metadata_xml = sys.argv[1]
tarballs = sys.argv[2:]

if not os.path.exists(metadata_xml):
    raise SystemExit(f"metadata xml does not exist: {metadata_xml}")

for tarball in tarballs:
    if not os.path.exists(tarball):
        raise SystemExit(f"tarball does not exist: {tarball}")

    print(f"Patching tarball: {tarball}")

    with tempfile.TemporaryDirectory(prefix="angelgrib_tarball_") as tmp:
        extract_dir = os.path.join(tmp, "extract")
        os.makedirs(extract_dir, exist_ok=True)

        with tarfile.open(tarball, "r:gz") as tar:
            tar.extractall(extract_dir)

        shutil.copyfile(metadata_xml, os.path.join(extract_dir, "metadata.xml"))

        top_dirs = [
            os.path.join(extract_dir, name)
            for name in os.listdir(extract_dir)
            if os.path.isdir(os.path.join(extract_dir, name))
        ]

        for top_dir in top_dirs:
            shutil.copyfile(metadata_xml, os.path.join(top_dir, "metadata.xml"))

        tmp_tarball = tarball + ".tmp"

        with tarfile.open(tmp_tarball, "w:gz") as out:
            for root, dirs, files in os.walk(extract_dir):
                dirs.sort()
                files.sort()
                for filename in files:
                    path = os.path.join(root, filename)
                    arcname = os.path.relpath(path, extract_dir).replace(os.sep, "/")
                    out.add(path, arcname=arcname)

        os.replace(tmp_tarball, tarball)

    print("Verifying metadata entries:")
    with tarfile.open(tarball, "r:gz") as tar:
        names = tar.getnames()
        metadata_names = [name for name in names if name.endswith("metadata.xml")]
        for name in metadata_names:
            print(f"  {name}")

        if not metadata_names:
            raise SystemExit(f"No metadata.xml found after patching {tarball}")

print("Metadata injection complete.")
'@ | Set-Content -Path $script -Encoding UTF8

          $tarballArgs = @($xml.FullName) + @($tarballs | ForEach-Object { $_.FullName })
          python $script @tarballArgs

      - name: Verify tarball metadata using Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:RUNNER_TEMP "verify_tarballs.py"

          @'
import sys
import tarfile

ok = True

for tarball in sys.argv[1:]:
    print(f"Checking {tarball}")
    with tarfile.open(tarball, "r:gz") as tar:
        names = tar.getnames()
        metadata = [name for name in names if name.endswith("metadata.xml")]
        if not metadata:
            print("  ERROR: metadata.xml not found")
            ok = False
        else:
            for name in metadata:
                print(f"  {name}")

if not ok:
    raise SystemExit(1)
'@ | Set-Content -Path $script -Encoding UTF8

          $tarballs = Get-ChildItem -Path build -Recurse -Filter "*.tar.gz"
          python $script @($tarballs | ForEach-Object { $_.FullName })

      - name: List build output
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String -Width 240

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelgrib-plugin-manager-tarball
          path: |
            build/**/*.dll
            build/**/*.tar.gz
            build/**/*.exe
            build/**/*.xml
            build/**/*.log
