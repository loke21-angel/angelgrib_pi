name: Angel CPN Weather clean Windows plugin build

on:
  push:
    branches: [angel-cpn-weather-clean-build]
  workflow_dispatch:

env:
  ANGEL_CPN_WEATHER_RELEASE_TAG: v0.1.0-beta

jobs:
  windows-build:
    runs-on: windows-2022
    name: Build Windows OpenCPN plugin tarball
    env:
      WXWIN: C:\wxWidgets-3.2.1
      WX_VER: 32
      wxWidgets_ROOT_DIR: C:\wxWidgets-3.2.1
      wxWidgets_LIB_DIR: C:\wxWidgets-3.2.1\lib\vc_dll
      OCPN_TARGET: MSVC
      GETTEXT_BIN: C:\msys64\usr\bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Vendor OpenCPN libs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "opencpn-libs" -Recurse -Force -ErrorAction SilentlyContinue
          $urls = @(
            "https://github.com/OpenCPN/opencpn-libs.git",
            "https://github.com/jongough/opencpn-libs.git",
            "https://github.com/Rasbats/opencpn-libs.git"
          )
          $required = @(
            "opencpn-libs/WindowsHeaders",
            "opencpn-libs/api-18",
            "opencpn-libs/tinyxml",
            "opencpn-libs/odapi",
            "opencpn-libs/jsonlib",
            "opencpn-libs/wxJSON",
            "opencpn-libs/plugin_dc"
          )
          $ok = $false
          foreach ($url in $urls) {
            Write-Host "Trying $url"
            Remove-Item "opencpn-libs" -Recurse -Force -ErrorAction SilentlyContinue
            git clone --depth 1 $url opencpn-libs
            if ($LASTEXITCODE -ne 0) { continue }
            $missing = @()
            foreach ($path in $required) {
              if (-not (Test-Path $path)) { $missing += $path }
            }
            if ($missing.Count -eq 0) { $ok = $true; break }
            $missing | ForEach-Object { Write-Host "missing: $_" }
          }
          if (-not $ok) { throw "Could not vendor required OpenCPN libs." }

      - name: Install helper tools
        shell: pwsh
        run: choco install wget 7zip nsis -y --no-progress

      - name: Install Gettext using MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: gettext

      - name: Verify Gettext tools
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\msys64\usr\bin\msgmerge.exe")) { throw "msgmerge.exe not found" }
          if (-not (Test-Path "C:\msys64\usr\bin\msgfmt.exe")) { throw "msgfmt.exe not found" }
          "$env:GETTEXT_BIN" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download wxWidgets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:WXWIN | Out-Null
          Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.1/wxMSW-3.2.1_vc14x_Dev.7z" -OutFile "wxMSW-3.2.1_vc14x_Dev.7z"
          Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.1/wxWidgets-3.2.1-headers.7z" -OutFile "wxWidgets-3.2.1-headers.7z"
          7z x "wxMSW-3.2.1_vc14x_Dev.7z" "-o$env:WXWIN" -y
          7z x "wxWidgets-3.2.1-headers.7z" "-o$env:WXWIN" -y

      - name: Download OpenCPN Windows build support
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/opencpnplugins/files/opencpn.lib" -OutFile "opencpn.lib"
          Invoke-WebRequest -Uri "https://download.opencpn.org/s/oibxM3kzfzKcSc3/download" -OutFile "OpenCPN_buildwin-4.99a.7z"
          7z x -y "OpenCPN_buildwin-4.99a.7z" "-obuildwin"

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          set PATH=%PATH%;%WXWIN%;%wxWidgets_LIB_DIR%;C:\msys64\usr\bin
          cmake -S . -B build -A Win32 ^
            -DGETTEXT_MSGMERGE_EXECUTABLE=C:/msys64/usr/bin/msgmerge.exe ^
            -DGETTEXT_MSGFMT_EXECUTABLE=C:/msys64/usr/bin/msgfmt.exe

      - name: Build package
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          set PATH=%PATH%;%WXWIN%;%wxWidgets_LIB_DIR%;C:\msys64\usr\bin
          cmake --build build --target package --config Release --verbose

      - name: Make tarball release-ready
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tarballs = Get-ChildItem -Path build -Recurse -Filter "*.tar.gz"
          $xml = Get-ChildItem -Path build -Recurse -Filter "*.xml" | Where-Object { $_.Name -like "*angel_cpn_weather*.xml" } | Select-Object -First 1
          if ($tarballs.Count -eq 0) { throw "No .tar.gz plugin tarball found" }
          if (-not $xml) { throw "No Angel CPN Weather metadata XML found" }
          $args = @("--metadata", $xml.FullName, "--repo", "https://github.com/${{ github.repository }}", "--tag", "${{ env.ANGEL_CPN_WEATHER_RELEASE_TAG }}", "--dll-name", "angel_cpn_weather_pi.dll", "--display-name", "Angel CPN Weather")
          foreach ($tarball in $tarballs) { $args += @("--tarball", $tarball.FullName) }
          python scripts/make_release_ready_tarball.py @args

      - name: Verify tarballs
        shell: pwsh
        run: |
          $tarballs = Get-ChildItem -Path build -Recurse -Filter "*.tar.gz"
          foreach ($tarball in $tarballs) {
            python scripts/verify_plugin_tarball.py --tarball "$($tarball.FullName)" --dll-name angel_cpn_weather_pi.dll
          }

      - name: Collect artifact
        shell: pwsh
        run: |
          Remove-Item artifact-output -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory artifact-output | Out-Null
          $tarball = Get-ChildItem -Path build -Recurse -Filter "angel_cpn_weather_pi-*.tar.gz" | Sort-Object FullName | Select-Object -First 1
          $xml = Get-ChildItem -Path build -Recurse -Filter "angel_cpn_weather_pi-*.xml" | Sort-Object FullName | Select-Object -First 1
          if (-not $tarball) { throw "Could not find angel_cpn_weather_pi tarball" }
          Copy-Item $tarball.FullName artifact-output\
          if ($xml) { Copy-Item $xml.FullName artifact-output\ }
          Get-ChildItem artifact-output

      - name: Upload release-ready plugin tarball
        uses: actions/upload-artifact@v4
        with:
          name: angel-cpn-weather-release-ready-plugin-tarball
          path: artifact-output/**
